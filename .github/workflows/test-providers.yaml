name: Test Providers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    name: Provider Source Gates
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test provider source gates
        run: pnpm --dir apps/worker test
      - name: Typecheck provider worker
        run: pnpm --dir apps/worker check-types
