services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: selena_visibility_test
      POSTGRES_PASSWORD: selena_test
      POSTGRES_USER: selena_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U selena_test -d selena_visibility_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
